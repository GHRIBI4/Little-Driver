<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="75" y="53" font-size="37" font-weight="700" fill="#122139">LITTLE DRIVER — THREE UTILITY CURVES</text>
<text x="75" y="88" font-size="22" fill="#526174">Same axes. Read the input and units for each color.</text>
<rect x="75" y="112" width="480" height="110" rx="12" fill="#2563eb" fill-opacity=".07"/><text x="95" y="144" font-size="23" font-weight="700" fill="#2563eb">POLICE · x = speed (km/h)</text><text x="95" y="178" font-size="23" fill="#18293e">f(x) = 0.6 + 0.08 × (x − 50)</text><text x="95" y="205" font-size="18" fill="#526174">Speed range: above 50, up to 55 km/h</text>
<rect x="570" y="112" width="480" height="110" rx="12" fill="#d97706" fill-opacity=".07"/><text x="590" y="144" font-size="23" font-weight="700" fill="#d97706">PEDESTRIAN · x = distance ahead (m)</text><text x="590" y="178" font-size="23" fill="#18293e">f(x) = 0.85 × (1 − 0.4 × x / 45)</text><text x="590" y="205" font-size="18" fill="#526174">Crossing detection range: up to 45 m</text>
<rect x="1065" y="112" width="480" height="110" rx="12" fill="#0f8b8d" fill-opacity=".07"/><text x="1085" y="144" font-size="23" font-weight="700" fill="#0f8b8d">VEHICLE · x = distance to vehicle (m)</text><text x="1085" y="178" font-size="23" fill="#18293e">f(x) = 0.65 × (1 − x / 40)</text><text x="1085" y="205" font-size="18" fill="#526174">Vehicle detection range: up to 20 m</text>
