<text x="869.5454545454545" y="705.7142857142858" font-size="23" fill="#526174">Closer = move LEFT on distance curves</text>
<text x="869.5454545454545" y="737.1428571428571" font-size="23" fill="#526174">Faster = move RIGHT on the speed curve</text>
<rect x="75" y="910" width="1480" height="155" rx="14" fill="#f1f5f9"/>
<text x="100" y="946" font-size="24" font-weight="700" fill="#122139">Which action wins?</text>
<text x="100" y="982" font-size="24" fill="#18293e">At the three example inputs:  Police 0.80 &gt; Pedestrian 0.68 &gt; Vehicle 0.488 → POLICE WINS.</text>
<text x="100" y="1017" font-size="21" fill="#526174">These are formula scores before eligibility checks. If an action is not allowed, its utility is 0.</text>
<text x="100" y="1048" font-size="20" fill="#526174">Cooldowns, visibility, random crossing requests and lead time still apply. The temporary 1.1 completion lock is not plotted.</text>
<text x="75" y="1099" font-size="18" fill="#64748b">Current settings: maximum speed 55 km/h · speed limit 50 km/h · crossing range 45 m · vehicle range 20 m</text>
